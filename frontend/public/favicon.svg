<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ua-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B5" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C59B4E" />
      <stop offset="100%" stop-color="#A67C33" />
    </linearGradient>
    <linearGradient id="ua-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED799" />
      <stop offset="50%" stop-color="#B99A69" />
      <stop offset="100%" stop-color="#7D5F30" />
    </linearGradient>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Base -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#141310" stroke="url(#ua-border)" stroke-width="1.8" />

  <!-- Inner Debossed Foil Inset Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="10" fill="none" stroke="url(#ua-gold)" stroke-width="0.75" stroke-opacity="0.45" />

  <!-- Top 4-Point Heirloom Star Motif -->
  <path d="M32 9 L33.4 13.8 L38.2 15.2 L33.4 16.6 L32 21.4 L30.6 16.6 L25.8 15.2 L30.6 13.8 Z" fill="url(#ua-gold)" filter="url(#subtle-glow)" />

  <!-- Monogram UA in Crisp Vector Geometry -->
  <g fill="url(#ua-gold)" filter="url(#subtle-glow)">
    <!-- Letter U: Left Stem, Bottom Arch, Right Stem with Serifs -->
    <path d="M16 26.5 h7 v2 h-2.2 v11.4 c0 3.8 2.2 6.1 5.4 6.1 c3.2 0 5.4-2.3 5.4-6.1 v-11.4 h-2.2 v-2 h6.8 v2 h-2.2 v11.4 c0 5.2 -3.4 8.2 -7.8 8.2 c-4.4 0 -7.8-3 -7.8-8.2 v-11.4 h-2.4 Z" />
    <!-- Letter A: Left Leg, Apex, Right Leg, Crossbar with Serifs -->
    <path d="M43.5 48 h-3.2 l-1.8 -4.8 h-7.6 l-1.8 4.8 h-3.2 l7.4 -19.5 h2.8 Z M34.4 38 h6.2 l-3.1 -8.8 Z" />
  </g>

  <!-- Fine Foil Underline & Heirloom Center Diamond -->
  <line x1="21" y1="53.5" x2="43" y2="53.5" stroke="url(#ua-gold)" stroke-width="0.8" stroke-opacity="0.65" />
  <circle cx="32" cy="53.5" r="1.3" fill="url(#ua-gold)" />
</svg>
